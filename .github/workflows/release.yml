name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate that the tag version matches Cargo.toml before building
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION validated"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: true

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-compilation dependencies for aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Package artifacts
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          STAGING="yak-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$STAGING"

          # CLI binary
          cp "target/${{ matrix.target }}/release/yak" "$STAGING/"

          # C library
          if [ -f "target/${{ matrix.target }}/release/libyak_c.so" ]; then
            cp "target/${{ matrix.target }}/release/libyak_c.so" "$STAGING/"
          fi
          if [ -f "target/${{ matrix.target }}/release/libyak_c.dylib" ]; then
            cp "target/${{ matrix.target }}/release/libyak_c.dylib" "$STAGING/"
          fi
          cp "target/${{ matrix.target }}/release/libyak_c.a" "$STAGING/" 2>/dev/null || true

          # Licenses
          cp LICENSE-MIT LICENSE-APACHE "$STAGING/"

          tar czf "$STAGING.tar.gz" "$STAGING"
          echo "ASSET=$STAGING.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "yak-$($env:GITHUB_REF_NAME)-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging

          # CLI binary
          Copy-Item "target/${{ matrix.target }}/release/yak.exe" $staging/

          # C library
          if (Test-Path "target/${{ matrix.target }}/release/yak_c.dll") {
            Copy-Item "target/${{ matrix.target }}/release/yak_c.dll" $staging/
          }
          if (Test-Path "target/${{ matrix.target }}/release/yak_c.dll.lib") {
            Copy-Item "target/${{ matrix.target }}/release/yak_c.dll.lib" $staging/
          }
          if (Test-Path "target/${{ matrix.target }}/release/yak_c.lib") {
            Copy-Item "target/${{ matrix.target }}/release/yak_c.lib" $staging/
          }

          # Licenses
          Copy-Item LICENSE-MIT, LICENSE-APACHE $staging/

          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: yak-*.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dry-run publish to validate crates.io readiness (does not actually publish)
  publish-dry-run:
    name: Publish dry run
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p yak --dry-run
      - run: cargo publish -p yak_cl --dry-run
